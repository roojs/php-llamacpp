name: Release

# Tag pushes (scripts/release.sh) build php-llama for each suite and
# attach every .deb to the one vX.Y.Z GitHub Release.

run-name: Release - ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debian:
    name: Debian
    uses: ./.github/workflows/x-debian.yml
    permissions:
      contents: read

  publish:
    name: Publish
    needs: build-debian
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          chmod +x scripts/release/changelog.sh scripts/release/render-release-notes.sh
          ./scripts/release/render-release-notes.sh "$GITHUB_REF_NAME" release-notes.md
          files=(artifacts/*/*.deb)
          if ((${#files[@]} == 0)) || [[ ! -f "${files[0]}" ]]; then
            echo "no .deb assets" >&2
            exit 1
          fi
          ls -lh "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
          || {
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file release-notes.md
          }
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest

      - name: Finalize changelog on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/release/finalize-changelog.sh "$GITHUB_REF_NAME"
          git add CHANGELOG.md debian/changelog
          git diff --staged --quiet && exit 0
          git commit -m "Finalize changelog for $GITHUB_REF_NAME"
          default_branch="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
          git push origin "HEAD:${default_branch}"
